<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta name="robots" content="noindex">
  <!-- fallback meta refresh -->
  <meta http-equiv="refresh" content="0; url=https://www.ayas.fyi">
  <script>
    (function() {
      // preserve path and query string
      var target = "https://www.ayas.fyi" + window.location.pathname + window.location.search + window.location.hash;
      // use replace so back button doesn't keep the redirect page
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="https://www.ayas.fyi">www.ayas.fyi</a>…</p>
</body>
</html>
